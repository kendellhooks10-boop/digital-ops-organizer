<title>Digital Ops Organizer</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style id="app-css">
/* Layout: one calm work surface. A fixed header with the month, four tabs, and a side panel for a single task.
   The only strong color on the page belongs to people: each teammate has their own hue. */
/* Light by default; dark when the viewer's setting is dark. The switch at the bottom of the page overrides both for this viewer. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#E9EBEF; --raise:#FFFFFF; --lift:0 2px 6px rgba(18,21,28,.08),0 14px 30px rgba(18,21,28,.14); --ink:#12151C; --ink2:#4E5665; --ink3:#7C8494; --line:#DCDFE6; --line2:#C9CDD6;
  --accent:#1D4FD8; --accent-ink:#FFFFFF; --accent-soft:#E4EBFD;
  --ok:#16794A; --ok-soft:#DDF1E5; --warn:#9A5B00; --warn-soft:#FBEACB; --bad:#B9302A; --bad-soft:#FADFDC;
  --chip-s:62%; --chip-bg-l:91%; --chip-fg-l:27%; --chip-line-l:78%;
  --bar-bg:#E8EEFD; --bar-line:#C9D6FB; --bar-ink:#12151C; --go-bg:#1D4FD8; --go-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(18,21,28,.06),0 8px 24px rgba(18,21,28,.08); color-scheme:light;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-mode="light"]){
  --bg:#181B22; --surface:#22262F; --sunk:#14161C; --raise:#2A2F39; --lift:0 2px 6px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.45); --ink:#ECEEF3; --ink2:#AEB5C3; --ink3:#7F8797; --line:#2F343F; --line2:#3E4452;
  --accent:#8CA8FF; --accent-ink:#0B1026; --accent-soft:#27325C;
  --ok:#66CE99; --ok-soft:#1A3B2B; --warn:#F0B65C; --warn-soft:#3E2F12; --bad:#FF9089; --bad-soft:#47211E;
  --chip-s:46%; --chip-bg-l:25%; --chip-fg-l:86%; --chip-line-l:39%;
  --bar-bg:#0E1015; --bar-line:#3E4452; --bar-ink:#F4F6FA; --go-bg:#8CA8FF; --go-ink:#0B1026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]:not([data-mode="light"]){
  --bg:#181B22; --surface:#22262F; --sunk:#14161C; --raise:#2A2F39; --lift:0 2px 6px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.45); --ink:#ECEEF3; --ink2:#AEB5C3; --ink3:#7F8797; --line:#2F343F; --line2:#3E4452;
  --accent:#8CA8FF; --accent-ink:#0B1026; --accent-soft:#27325C;
  --ok:#66CE99; --ok-soft:#1A3B2B; --warn:#F0B65C; --warn-soft:#3E2F12; --bad:#FF9089; --bad-soft:#47211E;
  --chip-s:46%; --chip-bg-l:25%; --chip-fg-l:86%; --chip-line-l:39%;
  --bar-bg:#0E1015; --bar-line:#3E4452; --bar-ink:#F4F6FA; --go-bg:#8CA8FF; --go-ink:#0B1026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }
:root[data-mode="dark"]{
  --bg:#181B22; --surface:#22262F; --sunk:#14161C; --raise:#2A2F39; --lift:0 2px 6px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.45); --ink:#ECEEF3; --ink2:#AEB5C3; --ink3:#7F8797; --line:#2F343F; --line2:#3E4452;
  --accent:#8CA8FF; --accent-ink:#0B1026; --accent-soft:#27325C;
  --ok:#66CE99; --ok-soft:#1A3B2B; --warn:#F0B65C; --warn-soft:#3E2F12; --bad:#FF9089; --bad-soft:#47211E;
  --chip-s:46%; --chip-bg-l:25%; --chip-fg-l:86%; --chip-line-l:39%;
  --bar-bg:#0E1015; --bar-line:#3E4452; --bar-ink:#F4F6FA; --go-bg:#8CA8FF; --go-ink:#0B1026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:20px 80px}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h2{font-size:17px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86em;letter-spacing:-.01em}
.dim{color:var(--ink3)} .sub{color:var(--ink2);font-size:14px} .small{font-size:13px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.top-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.month b{font-weight:600;min-width:132px;text-align:center;font-size:14px}
.ib{border:0;background:transparent;border-radius:7px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink2);font-size:16px}
.ib:hover{background:var(--sunk);color:var(--ink)}
.sync{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.live{background:var(--ok)}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:550;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.quiet{background:var(--sunk);color:var(--ink2)}
#view{margin-top:20px}

/* buttons, fields */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:550;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.9}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.linkish{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.linkish:hover{text-decoration:underline;text-underline-offset:3px}
a{color:var(--accent);text-underline-offset:3px}
.in,.ta,.sel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0;width:100%}
.in:hover,.ta:hover,.sel:hover{border-color:var(--line2)}
.in.bare{border-color:transparent;background:transparent;padding:4px 6px}
.in.bare:hover{border-color:var(--line)}
.in.bare:focus{background:var(--surface);border-color:var(--line2)}
.in:disabled,.ta:disabled,.sel:disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);background:transparent;border-color:transparent}
.ta{resize:vertical;min-height:72px;line-height:1.45}
input[type="date"].in{width:auto;min-width:128px;font-family:var(--mono);font-size:13px}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--ink);flex:none;margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:550;min-width:0}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1px dashed var(--line2);border-radius:12px}

/* people chips and pills */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:nowrap;
  background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h) var(--chip-s) var(--chip-fg-l));border:1px solid hsl(var(--h) var(--chip-s) var(--chip-line-l))}
.chip.neutral{background:var(--sunk);color:var(--ink2);border-color:var(--line)}
.chip.ghosted{background:transparent;border-style:dashed}
button.chip{cursor:pointer}
button.chip[aria-pressed="false"]{background:transparent;color:var(--ink3);border-color:var(--line);font-weight:500}
button.chip[aria-pressed="false"]:hover{color:var(--ink);border-color:var(--line2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.pill.ip,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.cp,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.line{background:transparent;border:1px solid var(--line2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:2px 7px;font-weight:550}
.code{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.nx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
button.nx:hover{border-color:var(--line2)}
.nx b{font-weight:600;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{background:var(--surface);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:6px 0}
.day{background:var(--surface);min-height:84px;padding:5px;border:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.day.out{background:var(--bg)} .day.out .dn{color:var(--ink3);opacity:.6}
.day.cls{background:color-mix(in srgb,var(--accent-soft) 38%,var(--surface))}
.day.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.dn{font-family:var(--mono);font-size:12px;color:var(--ink2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--ink);color:var(--bg);font-weight:600}
.ci{font-size:11px;line-height:1.25;border-radius:4px;padding:1px 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--sunk);color:var(--ink2);max-width:100%}
.ci.due{background:var(--bad-soft);color:var(--bad);font-weight:600}
.ci.due.done{background:var(--ok-soft);color:var(--ok)}
.ci.plan{background:transparent;border:1px dashed var(--line2)}
.ci.ev{background:var(--accent-soft);color:var(--ink)}
.ci.more{background:transparent;color:var(--ink3)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.dots i.due{background:var(--bad)} .dots i.ev{background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.dayp{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.tl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.tr:first-child{border-top:0}
.tr .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tr .meta{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gh{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:14px 0 2px}
.gh:first-child{margin-top:0}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;min-width:44px;flex:0 0 44px}
.bar i{display:block;height:100%;background:var(--ink2)}
details.flags summary{cursor:pointer;font-weight:600}
details.flags ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2);font-size:14px}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid hsl(var(--h) var(--chip-s) var(--chip-line-l))}
button.pc:hover{border-color:var(--line2);border-top-color:hsl(var(--h) var(--chip-s) var(--chip-line-l))}
.pc.team,button.pc.team:hover{border-top-color:var(--ink2)}
.pc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.pc .nm{font-size:18px;font-weight:700;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat b{display:block;font-family:var(--mono);font-size:16px;font-weight:500}
.stat span{font-size:11.5px;color:var(--ink3)}
.tb{padding:14px 0;border-top:1px solid var(--line)}
.tb:first-of-type{border-top:0;padding-top:0}
.tb-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0}
.ck .x{overflow-wrap:anywhere}
.ck.done .x{color:var(--ink3);text-decoration:line-through}
.ck .side{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* sort board */
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(178px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px;min-width:0;border:2px solid transparent}
.col.over,.zone.over{border-color:var(--ink);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:4px 6px;padding:4px 4px 2px;flex-wrap:wrap}
.col-h .mono{white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none;cursor:grab;position:relative;min-width:0}
.card:hover{border-color:var(--line2)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;padding-right:18px;overflow-wrap:anywhere}
.card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card.dragging,.srow.dragging,.citem.dragging{opacity:.35}
.sort-line{position:fixed;z-index:61;height:3px;border-radius:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 0 2px var(--surface)}
.srow .grip{opacity:.75}
.srow:hover .grip{opacity:1}
.grip{position:absolute;right:4px;top:6px;width:18px;height:24px;touch-action:none;cursor:grab;opacity:.5;
  background-image:radial-gradient(circle,var(--ink3) 1.2px,transparent 1.4px);background-size:6px 6px;background-position:center;background-repeat:space}
.drag-ghost{position:fixed!important;z-index:60;pointer-events:none;box-shadow:var(--lift);transform:rotate(1.5deg) scale(1.02);opacity:.97;margin:0!important;background:var(--surface)!important;border:1px solid var(--line2)!important;border-radius:10px!important;padding:8px 10px!important;outline:0!important}
.sugg{border-top:1px dashed var(--line2);padding-top:6px;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink2)}
.intake .ta{min-height:150px;font-size:14px}
.draft{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.dr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dr-h .in{font-size:20px;font-weight:700;letter-spacing:-.015em}
.dr-h .code{white-space:normal;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sheet{color:var(--ink2);font-size:14px}
.sheet ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details>summary{cursor:pointer}
.zones{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:calc(-16px - env(safe-area-inset-top,0px));z-index:2;background:var(--bg);padding:8px 0}
.zone{border:2px dashed var(--line2);border-radius:8px;padding:5px 8px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.srow{display:grid;grid-template-columns:18px auto minmax(0,1fr) 62px auto auto;gap:6px;align-items:start;padding:4px 0;border-top:1px solid var(--line);position:relative}
.srow:first-of-type{border-top:0}
.srow .grip{position:static;height:22px}
.srow .mins{width:62px;text-align:right;font-family:var(--mono);font-size:13px;padding-inline:6px}
.srow.done .in.bare{color:var(--ink3);text-decoration:line-through}
textarea.auto{resize:none;overflow:hidden;line-height:1.35;display:block;font-family:inherit}
.srow .sel{width:auto;padding:3px 6px;font-size:13px;max-width:104px}
.xbtn{border:0;background:transparent;color:var(--ink3);width:24px;height:24px;border-radius:6px;font-size:15px;line-height:1}
.xbtn:hover{background:var(--sunk);color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.cl{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.cl th{font-size:11.5px;text-align:left;font-weight:650;color:var(--ink2);background:var(--sunk);padding:7px 8px;white-space:nowrap}
.cl td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.cl td.it{min-width:170px}
.cl td.rq{color:var(--ink2);min-width:150px;font-size:13px}
.cl tr.done td.it span{text-decoration:line-through;color:var(--ink3)}

{"by": "claude", "impact": "", "kind": "research", "learning": "", "limits": "Miro wrote it to promote its own tool, and our sheet asks for the diagram in Google Slides.", "o": 1, "says": "A visual sitemap is a diagram of every page on a site and how the pages connect, made before any design starts. The article gives seven steps: set the goals and audience, list every page you want, group related pages, connect them like a family tree with a note on each page's purpose, get team feedback, revise, then hand it to whoever builds the site. It warns that too many sections overwhelm visitors.", "src": "Miro: How to create a sitemap", "url": "https://miro.com/blog/how-to-create-a-sitemap/"}}, "resp": "All Team Members", "status": "In Progress", "steps": ["Review the Marketing Task 10: Develop a Website (HUB: Curriculum / Marketing / Marketing Task 10 Develop a Website).", "After reviewing Task 10, make a copy of the Site Map Research doc and share the file with the department team members.", "Each team member visits 3 different business websites that are similar to what your company is selling. Also use the input from the E2.2 Business Start Up assignment for ideas on sites to research. Record your findings from each site on the shared Site Map Research doc.", "Each member also researches at least one website from a previous VE company (veinternational.org/competition-samples or LMA VE Websites).", "Once everyone has finished, meet as a group and review the findings. Discuss and list the pages that should be included on the company website. Make a copy of the Site Map Design and create a site map diagram in Google Slides showing how you plan to design the company website."], "suggest": [], "title": "Company Site Map", "todo": {"a1": {"done": true, "mins": 20, "o": 1, "owner": "ken", "text": "Review Marketing Task 10: Develop a Website on the HUB", "when": "2026-10-13"}, "a10": {"done": false, "mins": 20, "o": 10, "owner": "malik", "text": "Research 1 website from a past V {"completed": "", "done": false, "drive": false, "ev": "", "item": "Shortened URL of company site", "o": 3, "owner": "", "planned": "", "req": "Linked"}}, "code": "DO 1.6", "desc": "Each member of the Digital media department will be creating a homepage design they think would work well for the company's e-commerce website. The following needs to be completed individually by EACH team member.", "due": "", "group": "dept", "leads": {"l1": {"done": false, "o": 1, "text": "Ask Branding & Design for the logo, colors and slogan before you design."}, "l2": {"done": false, "o": 2, "text": "Show someone outside DO your homepage for 10 seconds, then ask what the company sells."}}, "month": "2026-10", "needs": "The short link from this task is also needed for the poster and banner in ID 1.5, where the banner is planned final on 10/27.", "notes": "ALL TEAM\n- Everyone creates a homepage design\n- Watch the linked videos\n- Slide presentation (Ken), 1 slide per person with their homepage design and explanation\n- Leadership meeting presenting the possible designs (Ken)", "o": 6, "owners": ["ken"], "research": {"r1": {"by": "claude", "impact": "", "kind": "research", "learning": "", "limits": "It is a marketing agency's blog with no date shown. The VE E-Commerce scoring guide is what our site gets judged on.", "o": 1, "says": "Eight things a store homepage should have: a consistent look with about three or four colors, a short line saying why to buy from you, a clean layout with white space, sharp on-brand photos, simple navigation with a search bar, a design that works on phones, pages that load in about two seconds, and regular testing of headings and buttons. It warns against clutter, long blocks of text and menus that hide the products.", "src": "WebFX: eCommerce homepage best practices", "url": "https://www.webfx.com/blog/web-design/ecommerce-homepage-best-practices"}}, "resp": "All Web Design Team", "status": "Not Started", "steps": ["Sign up for a new WIX account at wix.com, or if you have another platform you want to use, discuss with your teacher. Other options might include Canva, which has a web design option.", "Watch, individually or as a group, the two videos linked on the sheet: \"7 Steps to designing your online eCommerce Store\" and \"7 Biggest Mistakes eCommerce, Shopify, and Dropshipping Store Owners Make\".", "If your school district does not block WIX, explore WIX and template-based websites (not ADI) and find a site template you feel best represents the style and image of the company. Explore editing the template and designing the home page. When finished, publish the site and save the public link.", "The VP starts a new slide presentation. Each member creates a single slide to present their homepage design and rationale, with the site linked. The VP then schedules a meeting with leadership, the designs are presented, and leadership picks one to move forward as the company's e-commerce website.", "Make a shortened URL for the chosen site using bit.ly or tinyurl.com that can be used on company promotional materials. Make sure it has the company name and VE in the url."], "suggest": [], "title": "Company Homepage Designs", "todo": {"a1": {"done": false, "mins": 30, "o": 1, "owner": "ken", "text": "Watch the two eCommerce videos linked on the sheet", "when": ""}, "a10": {"done": false, "mins": 20, "o": 10, "owner": "marcos", "text": "Make one slide showing your homepage and why you designed it that way", "when": ""}, "a11": {"done": false, "mins": 20, "o": 11, "owner": "luke", "text": "Make one slide showing your homepage and why you designed it that way", "when": ""}, "a12": {"done": false, "mins": 20, "o": 12, "owner": "malik", "text": "Make one slide showing your homepage and why you designed it that way", "when": ""}, "a13": {"done": false, "mins": 10, "o": 13, "owner": "ken", "text": "Start the shared slide presentation for the team", "when": ""}, "a14": {"done": false, "mins": 10, "o": 14, "owner": "ken", "text": " sc": "At the end of the year, the Digital media department will create a Year in Review video for the company that shows the first year of the company through pictures, video clips, and music. Record video clips and take pictures that can be saved and used in the end of the year video. This task will be repeated each month. Do your best to get day to day happenings and any time a company event occurs.", "due": "2026-10-30", "group": "dept", "leads": {"l1": {"done": false, "o": 1, "text": "Ask AD and Mr. Moe which events are coming up this month."}, "l2": {"done": false, "o": 2, "text": "Ask Mr. Moe to show a Year in Review video from a past VE company."}}, "month": "2026-10", "notes": "SOLO (mostly)\n- Create the Year-End Video doc\n- Organize who will capture what (Ken helps)\n- Upload the month's media to Google Drive", "o": 7, "owners": ["luke"], "research": {"r1": {"by": "claude", "impact": "", "kind": "research", "learning": "", "limits": "It is about film B-roll in general and says nothing about naming or organizing files in Drive.", "o": 1, "says": "B-roll is the extra footage around the main action, like wide shots of the room, close-ups of hands working and signs that show where you are. The article says to write a shot list before filming, to hold each shot longer than feels needed so there is room to trim, and to shoot more angles than you think you need. It calls short clips the most common beginner mistake.", "src": "Adobe: What is B-roll?", "url": "https://www.adobe.com/creativecloud/video/discover/b-roll.html"}}, "resp": "All Team Members", "status": "In Progress", "steps": ["Create a doc to plan who will be capturing what for the month. Check in with AD and the teacher for upcoming events for the month so you know what you will be responsible for.", "Upload the clips and pictures to the Digital Operations folder on the Company Drive in a new folder called \"October Media\". Attach a link to the folder for review."], "suggest": [], "title": "Monthly M esearch": {"r1": {"by": "claude", "impact": "", "kind": "research", "learning": "", "limits": "It is aimed at real businesses. The router and encryption advice is controlled by the school district, so only the password, sharing, backup and training parts apply to us.", "o": 1, "says": "The Federal Trade Commission's basic security list for small businesses. Keep apps and browsers updated, back up important files, put a password on every device, and turn on multi-factor authentication. Passwords should be at least 12 characters, never reused and never shared by text or email. It also says to train staff regularly and to write down what to do if data gets lost.", "src": "FTC: Cybersecurity Basics for small business", "url": "https://www.ftc.gov/business-guidance/small-businesses/cybersecurity/basics"}}, "resp": "All Team Members", "status": "Not Started", "steps": ["Determine if any of the information is relevant to your company and situation.", "Develop guidelines for naming, saving and sharing documents on Google Drive, Trello, Canva, etc.", "Develop any other technology guidelines you think are relevant to the company.", "Work with HR to develop any tech and acceptable use policies.", "Create a brief presentation to share this information with the company."], "suggest": [], "title": "Company IT Plan", "todo": {"a1": {"done": false, "mins": 30, "o": 1, "owner": "team", "text": "Go through the IT Task 2 Quick Guide slides together", "when": ""}, "a2": {"done": false, "mins": 15, "o": 2, "owner": "team", "text": "Decide which parts apply to our company", "when": ""}, "a3": {"done": false, "mins": 45, "o": 3, "owner": "malik", "text": "Create the IT security plan, including the rules for naming, saving and sharing files in Drive and Canva", "when": ""}, "a4": {"done": false, "mins": 30, "o": 4, "owner": "malik", "text": "Write any other technology guidelines we need", "when": ""}, "a5": {"done": false, "mins": 30, "o": 5, "owner": "malik", "text": "Work with HR on the
